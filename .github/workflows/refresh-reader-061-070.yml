name: Refresh candidate Reader 061-070 release fingerprints

on:
  push:
    branches:
      - work/reader-v31-061-070-rules-audit-2026-10-27

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate content and regenerate release reports
        run: |
          python tools/validate_site_progress.py
          python tools/validate_reader_061_070_mechanics.py
          python tools/run_validation_suite.py --refresh-v2
          python tools/run_validation_suite.py --full
          python tools/validate_internal_navigation.py
          python tools/validate_reader_v31_checkpoint.py
      - name: Commit only regenerated evidence to candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/editorial-v2 audit/canonical-identity-v2 audit/deck-semantics audit/archive-core-v2 audit/deck-archives audit/official-mtg-decks audit/card-image-links audit/release-v2-validation-state.json
          if git diff --cached --quiet; then
            echo "No generated audit changes"
          else
            git commit -m "Refresh validation evidence and corpus fingerprint for Reader 061-070 preparation"
            git push origin HEAD:work/reader-v31-061-070-rules-audit-2026-10-27
          fi
