name: Build Reader 063-072 candidates and refresh archive evidence

on:
  push:
    branches:
      - work/reader-v31-063-072-2026-10-27
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate ten article candidates and metadata
        run: |
          python -m py_compile tools/prepare_reader_063_072.py
          python tools/prepare_reader_063_072.py --apply
          python tools/prepare_reader_063_072.py
          python tools/validate_reader_061_candidate.py
          python tools/validate_reader_062_candidate.py
          python tools/validate_site_progress.py
      - name: Print complete Reader V3.1 migration validation findings
        run: python tools/validate_reader_experience_v3.py
      - name: Print detailed historical deck-archive validation findings
        run: python tools/validate_historical_decks_only.py
      - name: Refresh protected release fingerprints and full release QA
        run: |
          python tools/run_validation_suite.py --quick
          python tools/run_validation_suite.py --refresh-v2
          python tools/run_validation_suite.py --full
          python tools/validate_internal_navigation.py
          python tools/validate_reader_v31_checkpoint.py
      - name: Commit validated articles, dossier, story and release evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 063-moat.html 064-nether-void.html 065-the-abyss.html 066-land-tax.html 067-sylvan-library.html 068-concordant-crossroads.html 069-eureka.html 070-candelabra-of-tawnos.html 071-transmute-artifact.html 072-power-artifact.html
          git add research-dossiers/numbered-wave-02 research-dossiers/reader-v31-063-072 validation/reader-v3.1-063-072-candidate-metrics.json
          git add audit/editorial-v2 audit/canonical-identity-v2 audit/deck-semantics audit/archive-core-v2 audit/deck-archives audit/official-mtg-decks audit/card-image-links audit/release-v2-validation-state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build ten Reader 063-072 source-and-rules reviewed candidate articles"
            git push origin HEAD:work/reader-v31-063-072-2026-10-27
          fi
